[project]
name = "showco"
version = "0.1.0"
description = "🎪 Local show control for recs and twitcho 🎪"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "recs",
    "twitcho",
    "tyro>=1.0.15",
]

[tool.uv.sources]
recs = { path = "../recs", editable = true }
twitcho = { path = "../twitcho", editable = true }

[project.scripts]
showco = "showco.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyupgrade>=3.21.2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
