#cloud-config
hostname: @HOSTNAME@
manage_etc_hosts: true

users:
  - name: @SHOW_USER@
    gecos: Show User
    groups: [adm, audio, dialout, plugdev, sudo, video]
    shell: /bin/bash
    lock_passwd: false
    passwd: "@PASSWORD_HASH@"
    ssh_authorized_keys:
      - "@SSH_PUBLIC_KEY@"

ssh_pwauth: false

package_update: true
package_upgrade: false
packages:
  - alsa-utils
  - ca-certificates
  - curl
  - ffmpeg
  - git
  - python3
  - python3-venv
  - rsync
  - sudo

write_files:
  - path: /etc/showco-provisioning.env
    permissions: "0644"
    content: |
      SHOW_USER=@SHOW_USER@
      CODE_DIR=/home/@SHOW_USER@/code
      RECS_REPO=@RECS_REPO@
      TWITCHO_REPO=@TWITCHO_REPO@
      SHOWCO_REPO=@SHOWCO_REPO@

runcmd:
  - [bash, -lc, "mkdir -p /opt/showco-provisioning"]
  - [bash, -lc, "cp /boot/firmware/pi-first-boot.sh /opt/showco-provisioning/pi-first-boot.sh || cp /boot/pi-first-boot.sh /opt/showco-provisioning/pi-first-boot.sh"]
  - [bash, /opt/showco-provisioning/pi-first-boot.sh]

final_message: "showco first-boot provisioning finished after $UPTIME seconds"
