action = "soundcheck-lights"

[[pages.sections.elements]]
name = "soundcheck-lights-check"
kind = "workflow_button"
label = "Confirm I saw the lights"
action = "soundcheck-check"
parameters = { step = "lights" }

[[pages.sections.elements]]
name = "soundcheck-stream-check"
kind = "workflow_button"
label = "Confirm I received the stream"
action = "soundcheck-check"
parameters = { step = "stream" }

