action = "soundcheck-check"
parameters = { step = "inputs" }

[[pages.sections]]
name = "sample"
title = "2. Record a sample"

[[pages.sections.elements]]
name = "sample-help"
kind = "text"
label = "Resuming records into the current recs session. Make a few seconds of sound, check that recorded audio advanced, then explicitly pause to finish the sample. Recording stays paused until you resume it. No new session is created."

[[pages.sections.elements]]
name = "confirm-output"
kind = "workflow_checkbox"
label = "I intend this recording or lighting change now"

[[pages.sections.elements]]
name = "soundcheck-start"
kind = "workflow_button"
label = "Resume recording and begin sample"
action = "soundcheck-start-recording"

[[pages.sections.elements]]
name = "soundcheck-recording"
kind = "workflow_button"
label = "Check sample writes"
action = "soundcheck-check"
parameters = { step = "recording" }

[[pages.sections.elements]]
name = "soundcheck-pause"
kind = "workflow_button"
label = "Pause recording to finish sample"
action = "soundcheck-pause-recording"

[[pages.sections]]
name = "playback-check"
title = "3. Hear the sample"

[[pages.sections.elements]]
name = "playback-help"
kind = "text"
label = "Open Playback, select the just-recorded sample and listen. Enter the session or file you heard below, then confirm playback. A counter increase alone does not prove playback."

[[pages.sections.elements]]
name = "check-note"
kind = "workflow_editor"
label = "Session/file heard, or reason for skipping"

[[pages.sections.elements]]
name = "soundcheck-playback"
kind = "workflow_button"
label = "Confirm I heard this sample"
action = "soundcheck-check"
parameters = { step = "playback" }

[[pages.sections]]
name = "outputs"
title = "4. Optional output checks"

[[pages.sections.elements]]
name = "outputs-help"
kind = "text"
label = "Test lights is explicit and leaves lights off. For streaming, inspect the live stream from another device. Use Actions to operate streamO if needed. Disabled outputs may be skipped with a reason. Cable testing remains outside this workflow until hardware validation is complete."

[[pages.sections.elements]]
