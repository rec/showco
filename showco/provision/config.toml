[network]
host = "bertrand.local"
web_port = 10000
swap_wifi = false
topology = ""

[paths]
root = "/home/tom/code"

[networks.internal]
subnet = "10.0.0.0/24"

[networks.internal.wifi]
name = "showbox"
ip_address = 1

[networks.external.wifi]
name = "Livebox-F13E"

[[mixers]]
name = "X18"
audio_device_names = ["X18", "XR18"]
port = 10024
ip_address = 18

[mixers.probe]
protocol = "udp"

[mixers.osc]
subscription_path = "/xremote"
resubscribe_period = 10

[[mixers]]
