<section>
  <h2>Prepare the set list</h2>
  <p>Saving replaces the list and resets its position. Previous recs markers remain unchanged.
    Unlock performance protection before editing. Song cues only add recording markers;
    they do not stop recording or change lights or streaming.</p>
  <div id="setlist-editor"></div>
  <button type="button" id="add-song" disabled>Add song</button>
  <button type="button" id="reload-setlist" disabled>Discard edits and reload saved list</button>
  <button type="button" data-workflow-action="setlist-save" disabled>Save set list and reset position</button>
  <p id="workflow-result" role="status"></p>
  <p><a href="/performance">Perform with this set list</a></p>
</section>
